name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests (no network needed)
        run: npm run test:unit

      - name: Integration tests
        env:
          MS_TODO_ACCESS_TOKEN: ${{ secrets.MS_TODO_ACCESS_TOKEN }}
          MS_TODO_LIST_ID: ${{ secrets.MS_TODO_LIST_ID }}
        run: |
          if [ -z "$MS_TODO_ACCESS_TOKEN" ] || [ -z "$MS_TODO_LIST_ID" ]; then
            echo "::notice::Secrets not fully configured — skipping integration tests"
            echo "Required: MS_TODO_ACCESS_TOKEN + MS_TODO_LIST_ID"
            echo "Configure at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 0
          fi
          npm run test:integration
